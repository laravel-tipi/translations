name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, mariadb, pgsql]

    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: tipi
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=5s --health-retries=20
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: tipi
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
      pgsql:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: tipi
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=20

    env:
      TRANSLATIONS_TEST_DB: ${{ matrix.database }}
      TRANSLATIONS_TEST_DB_PORT: ${{ matrix.database == 'mariadb' && '3307' || (matrix.database == 'pgsql' && '5432' || '3306') }}
      TRANSLATIONS_TEST_DB_PASSWORD: secret

    name: Tests (${{ matrix.database }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        if: matrix.database == 'sqlite'
        run: composer format:test

      - name: Run tests
        run: vendor/bin/pest
