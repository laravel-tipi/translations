# Database servers for the test suite: `docker compose up -d --wait`,
# then `composer test:all`. Data lives in memory and is gone on `down`.
name: tipi-translations-tests

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: tipi
    ports: ['127.0.0.1:33061:3306']
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-psecret']
      interval: 2s
      retries: 60

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: tipi
    ports: ['127.0.0.1:33062:3306']
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      retries: 60

  pgsql:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tipi
    ports: ['127.0.0.1:33063:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'tipi']
      interval: 2s
      retries: 60
